<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>総合管理画面 - Projects Portfolio</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9A%99%EF%B8%8F%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="styles.css">
</head>

<body class="admin-page">
    <!-- ログインオーバーレイ -->
    <div id="login-overlay">
        <div class="auth-card">
            <div class="auth-icon" aria-hidden="true">🔐</div>
            <h2>管理画面ログイン</h2>
            <p style="color:#64748b; font-size:0.9rem;">管理者パスワードを入力してください</p>
            <form id="admin-login-form">
                <div class="password-field-wrap">
                    <input
                        type="password"
                        id="password-input"
                        class="lock-input"
                        placeholder="Password"
                        autocomplete="current-password"
                        autocapitalize="off"
                        autocorrect="off"
                        spellcheck="false"
                        aria-label="管理者パスワード"
                        required
                    >
                    <button type="button" id="toggle-admin-pass" class="password-toggle-btn" aria-label="パスワードを表示">👁️</button>
                </div>
                <button type="submit" class="btn-primary" style="width:100%;">ログイン</button>
            </form>
            <p id="login-error" class="error-message" style="display: none;" role="alert"></p>
            <div class="lock-footer">
                <a href="portfolio.html">← ポートフォリオ一覧へ戻る</a>
            </div>
        </div>
    </div>

    <!-- 管理画面コンテンツ -->
    <div id="admin-app" style="display: none;">
        <nav class="top-nav">
            <a href="portfolio.html" class="nav-back">← 一覧に戻る</a>
            <h1 class="nav-title">⚙️ 総合管理画面</h1>
            <div class="nav-right">
                <button type="button" id="btn-logout" class="nav-logout">ログアウト</button>
            </div>
        </nav>

        <main class="container">
            <div class="admin-tabs" role="tablist">
                <button type="button" class="tab-btn active" data-tab="projects">📂 プロジェクト</button>
                <button type="button" class="tab-btn" data-tab="categories">🏷️ カテゴリー</button>
                <button type="button" class="tab-btn" data-tab="platforms">🔧 プラットフォーム</button>
            </div>

            <div id="tab-projects" class="tab-content">
                <!-- データ健全性診断＆バックアップ -->
                <div id="diagnostics-panel" class="diagnostics-panel">
                    <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:0.75rem;">
                        <strong id="diagnostics-summary" style="font-size:0.92rem;">診断中...</strong>
                        <div style="display:flex; gap:0.5rem; flex-wrap:wrap;">
                            <button type="button" id="btn-export-backup" class="btn-secondary" style="padding:0.45rem 0.9rem; font-size:0.84rem;">📥 JSONバックアップ保存</button>
                            <button type="button" id="btn-repair-issues" class="btn-primary" style="padding:0.45rem 0.95rem; font-size:0.84rem; background:#d97706; display:none;">🔧 検出された問題をすべて自動修復</button>
                        </div>
                    </div>
                    <ul id="diagnostics-list" class="diagnostics-list" style="display:none;"></ul>
                </div>

                <div class="admin-panel">
                    <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:0.75rem; margin-bottom:1rem;">
                        <h2 style="margin:0;">📋 登録済みプロジェクト</h2>
                        <button type="button" id="btn-save-order" class="btn-primary" style="background-color:#f59e0b; padding:0.55rem 1.1rem; font-size:0.88rem;">💾 並び順を保存</button>
                    </div>

                    <div class="admin-toolbar">
                        <input
                            type="search"
                            id="admin-search-input"
                            class="search-input"
                            style="flex:1 1 220px; padding-left:0.9rem;"
                            placeholder="🔍 管理一覧を検索（番号・タイトル・説明）..."
                            aria-label="管理一覧を検索"
                        >
                        <select id="admin-cat-filter" class="toolbar-select" style="flex:0 1 220px;" aria-label="カテゴリー絞り込み">
                            <option value="all">すべてのカテゴリー</option>
                        </select>
                    </div>

                    <div id="admin-projects-list" class="admin-list"></div>
                </div>

                <div class="admin-panel" id="default-project-form-container">
                    <h2>✨ プロジェクト追加・編集</h2>
                    <form id="add-project-form" class="project-form">
                        <input type="hidden" name="docId" id="edit-doc-id">
                        <div class="form-row">
                            <div class="form-group">
                                <label for="input-title">タイトル *</label>
                                <input type="text" name="title" id="input-title" required />
                            </div>
                            <div class="form-group">
                                <label>作成者 (複数選択可)</label>
                                <div style="display:flex; gap:1rem; flex-wrap:wrap; padding:0.45rem 0;">
                                    <label style="display:flex; align-items:center; gap:0.45rem; font-weight:normal; cursor:pointer;">
                                        <input type="checkbox" name="creators" value="Yuzu bot" class="creator-checkbox"> Yuzu bot
                                    </label>
                                    <label style="display:flex; align-items:center; gap:0.45rem; font-weight:normal; cursor:pointer;">
                                        <input type="checkbox" name="creators" value="Kedo bot" class="creator-checkbox"> Kedo bot
                                    </label>
                                </div>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="project-category-select">カテゴリー *</label>
                                <select name="categoryId" id="project-category-select" required></select>
                            </div>
                            <div class="form-group">
                                <label for="project-code-platform-select">コード保管場所</label>
                                <select name="codePlatformId" id="project-code-platform-select"></select>
                            </div>
                            <div class="form-group">
                                <label for="project-deploy-platform-select">デプロイ先 *</label>
                                <select name="deployPlatformId" id="project-deploy-platform-select" required></select>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="input-releaseDate">リリース日</label>
                                <input type="date" name="releaseDate" id="input-releaseDate" />
                            </div>
                            <div class="form-group">
                                <label for="input-tags">タグ（カンマ区切り）</label>
                                <input type="text" name="tags" id="input-tags" placeholder="例: 教育, 臨床実習, Cloudflare" />
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="input-description">説明文</label>
                            <textarea name="description" id="input-description" rows="4" placeholder="プロジェクトの概要や特徴を入力（※パスワード等の機密情報は記載しないでください）"></textarea>
                        </div>

                        <div class="form-group">
                            <label>リンク設定（あるものだけ入力・保存時に /u/0/ 等は自動整形されます）</label>
                            <div style="display:flex; flex-direction:column; gap:0.55rem;">
                                <input type="url" name="url" id="input-url" placeholder="🔗 LP / 公開サイト URL" />
                                <input type="url" name="formUrl" id="input-formUrl" placeholder="📝 Google Form / フォーム URL" />
                                <input type="url" name="spreadsheetUrl" id="input-spreadsheetUrl" placeholder="📊 スプレッドシート / データ URL" />
                                <input type="url" name="editUrl" id="input-editUrl" placeholder="⚙️ GAS / GitHub / 編集画面 URL" />
                            </div>
                        </div>

                        <div style="display:flex; gap:0.75rem; margin-top:0.5rem; flex-wrap:wrap;">
                            <button type="submit" class="btn-primary" id="submit-btn">追加する</button>
                            <button type="button" id="cancel-edit-btn" class="btn-secondary" style="display:none;">キャンセル</button>
                        </div>
                    </form>
                </div>
            </div>

            <div id="tab-categories" class="tab-content" style="display:none;">
                <div class="admin-panel">
                    <h2>🏷️ カテゴリー設定</h2>
                    <form id="add-category-form" class="project-form">
                        <input type="hidden" name="docId" id="edit-cat-id">
                        <div class="form-row">
                            <div class="form-group">
                                <label>カテゴリー名 *</label>
                                <input type="text" name="name" required />
                            </div>
                            <div class="form-group">
                                <label>表示順序 *</label>
                                <input type="number" name="order" required value="1" />
                            </div>
                        </div>
                        <div style="display:flex; gap:0.75rem; margin-top:0.5rem;">
                            <button type="submit" class="btn-primary" id="cat-submit-btn">追加する</button>
                            <button type="button" id="cat-cancel-btn" class="btn-secondary" style="display:none;">キャンセル</button>
                        </div>
                    </form>
                    <div id="admin-categories-list" class="admin-list" style="margin-top:1.75rem;"></div>
                </div>
            </div>

            <div id="tab-platforms" class="tab-content" style="display:none;">
                <div class="admin-panel">
                    <h2>🔧 プラットフォーム設定</h2>
                    <form id="add-platform-form" class="project-form">
                        <input type="hidden" name="docId" id="edit-plat-id">
                        <div class="form-row">
                            <div class="form-group">
                                <label>プラットフォーム名 *</label>
                                <input type="text" name="name" required />
                            </div>
                            <div class="form-group">
                                <label>バッジカラー</label>
                                <input type="color" name="color" value="#34A853" class="color-input" />
                            </div>
                        </div>
                        <div style="display:flex; gap:0.75rem; margin-top:0.5rem;">
                            <button type="submit" class="btn-primary" id="plat-submit-btn">追加する</button>
                            <button type="button" id="plat-cancel-btn" class="btn-secondary" style="display:none;">キャンセル</button>
                        </div>
                    </form>
                    <div id="admin-platforms-list" class="admin-list" style="margin-top:1.75rem;"></div>
                </div>
            </div>
        </main>
    </div>

    <script type="module" src="admin-app.js"></script>
</body>

</html>
