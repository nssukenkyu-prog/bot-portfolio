<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="description" content="Yuzu bot &amp; Kedo bot の開発プロジェクト・Webアプリ・自動化システム一覧ポートフォリオ">
    <meta property="og:title" content="Projects Portfolio">
    <meta property="og:description" content="Yuzu bot &amp; Kedo bot 開発プロジェクトポートフォリオ">
    <meta property="og:type" content="website">
    <title>Projects Portfolio</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%9A%80%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="styles.css">
</head>

<body class="portfolio-page">

    <div id="lock-screen">
        <div class="lock-card">
            <div class="lock-icon" aria-hidden="true">🔒</div>
            <h2>Secret Portfolio</h2>
            <p style="color:#64748b; font-size:0.92rem;">閲覧パスワードを入力してください</p>
            <form id="lock-form">
                <div class="password-field-wrap">
                    <input
                        type="password"
                        id="lock-password"
                        class="lock-input"
                        placeholder="Password"
                        autocomplete="current-password"
                        autocapitalize="off"
                        autocorrect="off"
                        spellcheck="false"
                        aria-label="閲覧パスワード"
                        required
                    >
                    <button type="button" id="toggle-lock-pass" class="password-toggle-btn" aria-label="パスワードを表示">👁️</button>
                </div>
                <button type="submit" class="btn-primary" style="width:100%;">解除する</button>
            </form>
            <p id="lock-error" class="lock-error" role="alert"></p>
            <div class="lock-footer">
                <a href="admin.html">🔐 管理画面へ移動</a>
            </div>
        </div>
    </div>

    <div id="main-content" style="display: none;">
        <nav class="top-nav" aria-label="メインナビゲーション">
            <h1 class="nav-title">🚀 Projects Portfolio</h1>
            <div class="nav-right">
                <button type="button" id="btn-relock" class="nav-lock" title="画面をロックする">🔒 ロック</button>
                <a href="admin.html" class="nav-admin">🔐 管理画面</a>
            </div>
        </nav>

        <main class="container">
            <div id="inapp-banner" class="inapp-banner" style="display: none;" role="status">
                <div>
                    <strong>💡 <span id="inapp-name">アプリ内</span>ブラウザで開いています：</strong>
                    Google製ツール（GASアプリ・フォーム等）が真っ白になる場合は、右上メニューから「Safari / Chrome（標準ブラウザ）で開く」をご利用ください。
                </div>
                <div class="inapp-banner-actions">
                    <button type="button" id="btn-copy-page-url" class="btn-banner">📋 このURLをコピー</button>
                    <button type="button" id="btn-dismiss-inapp" class="btn-banner" aria-label="案内を閉じる">✕</button>
                </div>
            </div>

            <div class="filter-section" id="filter-section" role="toolbar" aria-label="カテゴリー絞り込み"></div>

            <section class="toolbar-panel" aria-label="検索・並び替え・表示設定">
                <div class="toolbar-top">
                    <div class="search-box">
                        <span class="search-icon" aria-hidden="true">🔍</span>
                        <input
                            type="search"
                            id="search-input"
                            class="search-input"
                            placeholder="タイトル・キーワード・番号・タグで検索..."
                            aria-label="プロジェクトを検索"
                            autocapitalize="off"
                            autocorrect="off"
                            spellcheck="false"
                        >
                        <button type="button" id="search-clear" class="search-clear" aria-label="検索語をクリア">✕</button>
                    </div>

                    <select id="creator-filter" class="toolbar-select" aria-label="作成者で絞り込み">
                        <option value="all">👤 すべての作成者</option>
                        <option value="Yuzu bot">👤 Yuzu bot</option>
                        <option value="Kedo bot">👤 Kedo bot</option>
                        <option value="collab">🤝 共同制作</option>
                    </select>

                    <select id="platform-filter" class="toolbar-select" aria-label="基盤で絞り込み">
                        <option value="all">🖥️ すべての基盤</option>
                    </select>

                    <select id="sort-select" class="toolbar-select toolbar-sort-full" aria-label="並び順">
                        <option value="standard">↕️ 標準順</option>
                        <option value="newest">🕒 新しい順</option>
                        <option value="oldest">🔢 番号順 (1→)</option>
                    </select>
                </div>

                <div class="toolbar-bottom">
                    <div class="results-summary">
                        <span id="results-count" aria-live="polite">読み込み中...</span>
                        <button type="button" id="btn-reset-filters" class="btn-reset-filters" style="display: none;">条件をリセット</button>
                    </div>

                    <div class="view-controls">
                        <button type="button" id="toggle-manage-links" class="toggle-chip" aria-pressed="false" title="スプレッドシート・編集画面リンクの表示切替">
                            🔧 管理リンク (Sheet / Edit)
                        </button>
                        <div class="layout-switch" role="group" aria-label="表示レイアウト切替">
                            <button type="button" id="layout-grid" class="layout-btn active">⊞ 2列</button>
                            <button type="button" id="layout-list" class="layout-btn">☰ 1列</button>
                        </div>
                    </div>
                </div>
            </section>

            <div id="loading" class="loading" role="status">
                <div class="spinner" aria-hidden="true"></div>
                <p>データを取得中...</p>
            </div>

            <div id="projects-grid" class="projects-grid view-grid"></div>
        </main>
    </div>

    <!-- 詳細モーダル -->
    <div id="detail-modal-backdrop" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="detail-modal-title">
        <div class="detail-modal">
            <div class="detail-modal-header">
                <h2 id="detail-modal-title" style="font-size:1.15rem; line-height:1.45;"></h2>
                <button type="button" id="detail-modal-close" class="detail-modal-close" aria-label="閉じる">×</button>
            </div>
            <div id="detail-modal-body" class="detail-modal-body"></div>
        </div>
    </div>

    <button type="button" id="back-to-top" class="back-to-top" aria-label="ページ上部へ戻る" title="ページ上部へ戻る">↑</button>

    <script type="module" src="portfolio-app.js"></script>
</body>

</html>
